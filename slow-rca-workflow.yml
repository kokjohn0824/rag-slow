            - 環境: {{#node-parse-alert.structured_output.env#}}

            - 服務名稱: {{#node-parse-alert.structured_output.service_name#}}

            - 主機: {{#node-parse-alert.structured_output.host#}}

            - URL: {{#node-parse-alert.structured_output.url#}}

            - 症狀: {{#node-parse-alert.structured_output.user_symptom#}}


            ====================

            【Tempo 證據】

            ====================

            - 是否異常: {{#node-judge-anomaly.is_anomalous#}}

            - 慢 Trace 數量: {{#node-judge-anomaly.slow_trace_count#}}

            - 最慢 Trace ID: {{#node-judge-anomaly.top_trace_id#}}

